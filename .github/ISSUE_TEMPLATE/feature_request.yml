name: Feature request / 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题背景 / Problem
      description: 这个功能要解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 你希望怎么实现？（可附草图或伪代码）
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Scope
      options:
        - 仅文档
        - hosts 同步逻辑
        - 网络配置/计划任务
        - 跨平台/重构
    validations:
      required: false
